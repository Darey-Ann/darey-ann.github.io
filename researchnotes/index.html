<!--JS SECTION vvv -->
<script>
  const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  function formatDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return `${MONTHS[m - 1]} ${d}, ${y}`;
  }

  /* SECTION FOR HEART FUNCTION*/
  /* update the meta row to show the heart, add a toggle button, and filter on click: */
  let showHighlightsOnly = false;
  let allPosts = [];

  async function loadPosts() {
    const feed = document.getElementById("feed");
    const tagRow = document.getElementById("tagRow");
    if (!feed || !tagRow) return; // feed UI isn't on the page yet — nothing to do
    try {
      const res = await fetch("posts.json", { cache: "no-store" });
      if (!res.ok) throw new Error("Could not load posts.json");
      let posts = await res.json();

      // newest first
      posts = posts.slice().sort((a, b) => b.date.localeCompare(a.date));
      allPosts = posts;

      if (posts.length === 0) {
        feed.innerHTML = `<li class="empty">No entries yet — the first one will show up here.</li>`;
        tagRow.textContent = "ENTRIES: 0";
        return;
      }

      tagRow.textContent =
        `ENTRIES: ${posts.length} · STARTED: ${formatDate(posts[posts.length - 1].date)} · LATEST: ${formatDate(posts[0].date)}`;

      renderFeed();
    } catch (err) {
      feed.innerHTML = `<li class="error">Couldn't load entries (${err.message}). If you're viewing this file directly on your computer, note that posts.json only loads when served over http — it'll work fine once pushed to GitHub Pages.</li>`;
      tagRow.textContent = "—";
    }
  }

  /* Renders the feed (all posts, or just highlights if the toggle is on) — 
     called from loadPosts() and again whenever the heart toggle is clicked */
     
     /* extra notes ~Line 351 */
     /* <p>${escapeHtml(post.text)}</p> deliberately turns <a href="…"> into &lt;a href="…"&gt; */
     /* <p>${post.html ? post.text : escapeHtml(post.text)}</p> opts in */

  function renderFeed() {
    const feed = document.getElementById("feed");
    const posts = showHighlightsOnly ? allPosts.filter(p => p.highlight) : allPosts;
  
    /* This determines the template order of the posts */
    feed.innerHTML = posts.map((post) => `
      <li class="entry${post.highlight ? " is-highlight" : ""}">
        <div class="meta">
          <span class="date">${formatDate(post.date).toUpperCase()}${post.highlight ? `<span class="heart">♥</span>` : ""}</span> 
          <div class="mini-stamp">記</div>
        </div>
        
        <h3>${escapeHtml(post.title)}</h3>

        <p>${post.html ? post.text : escapeHtml(post.text)}</p>
        ${renderMedia(post.media || [])}
      </li>
    `).join("");
  
    // no carousel to wire up anymore — mosaic grid needs no JS after render
  }

  function mediaTag(item) {
    if (item.type === "video") {
      return `<video src="${item.src}" controls playsinline preload="metadata"></video>`;
    }
    return `<img src="${item.src}" alt="${escapeHtml(item.caption || "")}" loading="lazy">`;
  }

  /* Mosaic gallery — preserves each item's natural aspect ratio (no cropping),
   packs items into a masonry-style column layout, and collapses to fewer
   columns (then 1, on phones) so nothing gets squeezed too small */
  function renderMedia(media) {
    if (!media || media.length === 0) return "";
  
    return `
      <div class="media-grid">
        ${media.map(item => `
          <div class="media-item">
            ${mediaTag(item)}
            ${item.caption ? `<div class="media-item-caption">${escapeHtml(item.caption)}</div>` : ""}
          </div>
        `).join("")}
      </div>
    `;
  }
  
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }


  /* Wire up the heart button*/
  document.getElementById("highlightToggle").addEventListener("click", (e) => {
    showHighlightsOnly = !showHighlightsOnly;
    e.target.classList.toggle("active", showHighlightsOnly);
    e.target.textContent = showHighlightsOnly ? "← All entries" : "♥ Highlights";
    renderFeed();
  });

  /* Lightbox — click any image in the mosaic to enlarge it with its caption.
   Uses event delegation on #feed so it keeps working even after renderFeed()
   rebuilds the HTML. Videos are intentionally skipped for now. */
  function initLightbox() {
    const overlay = document.getElementById("lightbox");
    const imgEl = document.getElementById("lightboxImg");
    const captionEl = document.getElementById("lightboxCaption");
    const closeBtn = document.getElementById("lightboxClose");
  
    document.getElementById("feed").addEventListener("click", (e) => {
      const img = e.target.closest(".media-item img");
      if (!img) return;
      imgEl.src = img.src;
      captionEl.textContent = img.closest(".media-item").querySelector(".media-item-caption")?.textContent || "";
      overlay.classList.add("open");
    });
  
    function closeLightbox() {
      overlay.classList.remove("open");
      imgEl.src = "";
    }
  
    closeBtn.addEventListener("click", closeLightbox);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeLightbox(); // click on the dark backdrop
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });
  }
  
  initLightbox();
  

  loadPosts();
</script>
